name: News abrufen

on:
  schedule:
    - cron: "7,37 * * * *"   # alle 30 Minuten
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: news
  cancel-in-progress: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --omit=dev
      - run: node scripts/fetch-news.js
      # news.json in einen eigenen Branch legen (immer nur ein Commit, damit das Repo nicht wächst)
      - name: Veröffentlichen
        run: |
          cd out
          git init -q -b news-data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news.json
          git commit -q -m "News $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" news-data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
