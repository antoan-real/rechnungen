<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Daily Begleiter</title>
<meta name="theme-color" content="#f3f5f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#11161b" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Daily">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Literata:opsz,wght@7..72,400;7..72,600&display=swap">
<link rel="stylesheet" href="css/app.css">
<script>
  // Theme vor dem ersten Zeichnen setzen, damit nichts aufblitzt
  try { const th = localStorage.getItem("db-theme"); if (th === "light" || th === "dark") document.documentElement.dataset.theme = th; } catch (e) {}
</script>
</head>
<body>
  <div id="splash" class="splash"><div class="splash-logo" aria-hidden="true"></div><span>Daily Begleiter</span></div>

  <div id="login" class="login" hidden></div>

  <div id="shell" hidden>
    <header class="topbar">
      <a class="brand" href="#dashboard" aria-label="Start"><span class="brand-logo" aria-hidden="true"></span><span class="brand-name">Daily</span></a>
      <nav class="tabs" id="tabs" aria-label="Bereiche"></nav>
      <div class="more">
        <button type="button" class="more-btn" id="more-btn" aria-haspopup="menu" aria-expanded="false">Mehr <span aria-hidden="true">▾</span></button>
        <div class="more-menu" id="more-menu" role="menu" hidden></div>
      </div>
    </header>
    <div class="banner" id="banner" hidden></div>
    <main id="view" class="view" tabindex="-1"></main>
  </div>

  <div id="overlay-root"></div>
  <div id="toast-root" aria-live="polite"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
