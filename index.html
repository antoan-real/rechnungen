<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Daily Begleiter</title>
<meta name="theme-color" content="#F3F4F0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1113" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Daily">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="css/app.css">
<script>
  // Theme vor dem ersten Zeichnen setzen, damit nichts aufblitzt
  try {
    const th = localStorage.getItem("db-theme");
    if (th === "light" || th === "dark") {
      document.documentElement.dataset.theme = th;
      document.querySelectorAll('meta[name="theme-color"]').forEach(m => m.content = th === "dark" ? "#0F1113" : "#F3F4F0");
    }
    // Anzeigegröße und Schriftgröße gelten pro Gerät
    const z = parseFloat(localStorage.getItem("db-zoom")), f = parseFloat(localStorage.getItem("db-fs"));
    if (z > 0 && z !== 1) document.documentElement.style.zoom = z;
    if (f > 0 && f !== 1) document.documentElement.style.setProperty("--fs", f);
  } catch (e) {}
</script>
</head>
<body>
  <div id="splash" class="splash"><div class="splash-logo" aria-hidden="true"></div><span>Daily Begleiter</span></div>

  <div id="login" class="login" hidden></div>

  <div id="shell" hidden>
    <div class="apphead">
      <a class="hello" href="#dashboard" style="color:inherit;text-decoration:none"><small id="hd-date"></small><b id="hd-name">Hey</b></a>
      <button type="button" class="round-btn" id="theme-btn"></button>
      <a class="round-btn avatar" id="avatar" href="#einstellungen" aria-label="Einstellungen"></a>
    </div>
    <header class="topbar"><div class="topbar-in">
      <nav class="tabs" id="tabs" aria-label="Bereiche"></nav>
      <div class="more">
        <button type="button" class="more-btn" id="more-btn" aria-haspopup="menu" aria-expanded="false">Mehr <svg class="ic" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button>
        <div class="more-menu" id="more-menu" role="menu" hidden></div>
      </div>
    </div></header>
    <div class="banner" id="banner" hidden></div>
    <main id="view" class="view" tabindex="-1"></main>
  </div>

  <div id="overlay-root"></div>
  <div id="toast-root" aria-live="polite"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
